name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-publish:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\CodexAuthSwitcher.sln

      - name: Test
        run: dotnet test .\CodexAuthSwitcher.sln -c Release --no-restore --nologo

      - name: Publish
        shell: powershell
        run: .\publish.ps1 -Configuration Release -SkipTests -NoInstaller

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: CodexAuthSwitcher-win-x64
          path: artifacts/publish/win-x64/CodexAuthSwitcher.exe
          if-no-files-found: error
